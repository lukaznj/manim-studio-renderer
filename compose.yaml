# docker compose up -d   (then: docker compose logs renderer   for the pairing code)
services:
  renderer:
    image: ghcr.io/lukaznj/manim-studio-renderer:0.6.0
    # Or build it yourself instead of pulling:
    # build: { context: ., args: { STUDIO_REF: v0.6.0 } }
    restart: unless-stopped
    ports:
      # Listen on a private address only, e.g. this machine's Tailscale address: "100.x.y.z:7400:7400".
      # "7400:7400" listens on every address of the machine.
      - "7400:7400"
    environment:
      # How the app reaches this machine; it goes into the pairing code.
      STUDIO_WORKER_URL: http://my-server:7400
      # STUDIO_WORKER_SLICES: 4   # parts rendered at once; default: one per two cores, at most 6
    volumes:
      - renderer-data:/data # the token, the per-project caches and the jobs

volumes:
  renderer-data:
