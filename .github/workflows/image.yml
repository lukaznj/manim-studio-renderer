# Builds the image for a Manim Studio version and publishes it as ghcr.io/lukaznj/manim-studio-renderer.
# Push a tag named like the app's release (v0.4.0), or run it by hand with that version.
name: Image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Manim Studio version to build, e.g. v0.4.0
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          ref="${{ github.event.inputs.version || github.ref_name }}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "tag=${ref#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: STUDIO_REF=${{ steps.v.outputs.ref }}
          tags: |
            ghcr.io/lukaznj/manim-studio-renderer:${{ steps.v.outputs.tag }}
            ghcr.io/lukaznj/manim-studio-renderer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
